<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="image/websLogo-removebg-preview.png">
    <title>AI Hunt</title>
</head>

<body>
    <main>
        <header>
            <div class="container">
                <nav>
                    <div class="logo">
                        <img src="/image/websLogo-removebg-preview.png" alt="">
                        <h3>AI Hunt</h3>
                    </div>
                    <button class="login" id="login-sing">Sign up</button>
                </nav>
                <div class="hrader">
                    <div class="main-text">
                        <div class="text">
                            <h1>There is an AI for every<span>need.</span></h1>
                        </div>
                        <div class="decs">
                            <p>Discover powerful AI tools to create, learn, and grow faster. Find the right tool for
                                your workflow in seconds.</p>
                        </div>
                    </div>

                    <div class="search">
                        <input type="text" id="search" placeholder="Search Al tools...">
                        <div id="button">
                            <button class="all">All</button>
                            <button class="writing">Writing</button>
                            <button class="design">Design</button>
                            <button class="website">Website</button>
                            <button class="app">App</button>
                            <button class="video">Video</button>
                            <button class="audio">Audio</button>
                            <button class="coding">coding</button>
                            <button class="productivity">productivity</button>
                            <button class="marketing">Marketing</button>
                            <button class="education">Education</button>
                            <button class="email">Email</button>
                            <button class="SEO">SEO</button>


                        </div>
                    </div>

                    <div>
                        <div class="recomen">
                            <h2>Recommended AI Tools:</h2>
                        </div>
                    </div>

                    <div class="tools-container">
                        <div class="card">

                            <div class="title">
                                <img src="image/logo.png">
                                <h3>aiselfi.es</h3>
                            </div>

                            <div class="desc">
                                <p>Convierte selfies en fotos profesionales con IA.</p>
                            </div>

                            <div class="actions">
                                <button class="btn fill">Visitar sitio ↗</button>
                                <button class="btn">Imágenes</button>
                                <div class="icon-btn">❤</div>
                            </div>
                        </div>

                    </div>
                </div>
        </header>


    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>

</body>

</html>
